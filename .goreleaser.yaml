version: 2

project_name: calcmark

before:
  hooks:
    - go mod tidy

builds:
  - id: cm
    main: ./cmd/calcmark
    binary: cm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - none*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: calcmark
    # `skip_upload: auto` keeps pre-releases (v2.0.0-rc.1, v2.0.0-beta.X,
    # anything matching SemVer's prerelease syntax) OUT of the Homebrew
    # tap, so users running `brew install calcmark/tap/calcmark` keep
    # getting the latest stable. Stable tags (vX.Y.Z) still update the
    # cask normally.
    skip_upload: auto
    repository:
      owner: CalcMark
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://calcmark.org"
    description: "CalcMark - calculations embedded in markdown"
    url:
      verified: github.com/CalcMark/go-calcmark
    binaries:
      - cm
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cm"]
          end
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

release:
  github:
    owner: CalcMark
    name: go-calcmark
  draft: false
  prerelease: auto
