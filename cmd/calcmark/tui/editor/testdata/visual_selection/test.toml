# Visual selection mode test
# Tests Ctrl+G to enter visual mode, arrow keys to extend selection,
# copy/cut operations, and visual mode exit

[env]
name = "visual_selection"
directory = "."

[[steps]]
description = "Initial text entry"
input = "text:Hello world\nThis is a test"

[[steps]]
description = "Move to start of 'world'"
keys = ["home", "ctrl-right"]

[[steps]]
description = "Enter visual mode with Ctrl+G"
keys = ["ctrl-g"]
observer = "debug"

[[steps]]
description = "Extend selection to include 'world'"
keys = ["ctrl-right"]
observer = "debug"

[[steps]]
description = "Copy selection with Ctrl+C"
keys = ["ctrl-c"]
observer = "debug"

[[steps]]
description = "Exit visual mode with Ctrl+G"
keys = ["ctrl-g"]
observer = "debug"

[[steps]]
description = "Move to end of document"
keys = ["ctrl-end"]

[[steps]]
description = "Paste clipboard content"
keys = ["enter", "ctrl-v"]
observer = "results"

[[steps]]
description = "Test select all with Ctrl+A"
keys = ["ctrl-a"]
observer = "debug"

[[steps]]
description = "Copy all content"
keys = ["ctrl-c"]

[[steps]]
description = "Move to end and paste"
keys = ["ctrl-g", "end", "enter", "ctrl-v"]
observer = "lines"

[[steps]]
description = "Test visual mode with multi-line selection"
keys = ["home", "ctrl-g", "down", "end"]
observer = "debug"

[[steps]]
description = "Cut selection"
keys = ["ctrl-x"]
observer = "results"