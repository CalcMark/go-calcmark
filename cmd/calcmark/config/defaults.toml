# CalcMark Default Configuration
# This file is embedded in the binary at build time.
# User overrides: ~/.config/calcmark/config.toml or ~/.calcmarkrc.toml

[tui]
# Color mode: "auto" (detect from terminal), "light", or "dark"
# This controls the semantic theme colors. For manual color overrides, use [tui.theme] section.
color_mode = "auto"
# Deprecated: use color_mode instead
dark_mode = true

[tui.theme]
# Primary brand color - titles, prompts, variable names
primary = "#7D56F4"
# Accent color - borders, highlights
accent = "#874BFD"
# Error messages
error = "#FF5555"
# Changed/modified indicator
warning = "#FFAA00"
# Help text, secondary info
muted = "#888888"
# Hints, suggestions, preview text
dimmed = "#BBBBBB"
# Calculation results - high contrast for readability
output = "#FFFFFF"
# Syntax emphasis in help
bright = "#FFFFFF"
# Divider lines
separator = "#555555"

# Editor colors (dark mode defaults)
edit_line_bg = "#2E2E2E"    # Background for line being edited (slightly lighter than source pane)
edit_line_fg = "#FFFFFF"    # Foreground for line being edited (white text for contrast)
cursor_bg = "#7D56F4"       # Cursor background (primary brand color for high visibility)
cursor_fg = "#000000"       # Cursor foreground (black text on bright cursor)
current_line_bg = "#262626" # Background for current line in normal mode (subtle highlight)
current_line_fg = "#FFFFFF" # Foreground for current line in normal mode (white)
line_number = "#666666"     # Line number color
source_text = "#E0E0E0"     # Normal source text color (light gray for readability on dark)

# Calculation result display colors
calc_var_name = "#BBBBBB"   # Variable name in result (e.g., "x" in "x → 5") - muted gray
calc_arrow = "#888888"      # Arrow in result ("→") - dimmed
calc_value = "#4ECDC4"      # Calculated value (bright cyan for emphasis)

# Markdown preview colors
md_text = "#FFFFFF"       # Body text
md_h1_bg = "#FF9900"      # H1 heading background (orange)
md_h2_bg = "#33CC33"      # H2 heading background (green)
md_heading = "#FF9900"    # H3+ heading text
md_link = "#22AA22"       # Links (darker green for readability)
md_quote = "#888888"      # Block quote indicator (gray)
md_code = "#33CC33"       # Inline code text
md_code_bg = "#333333"    # Code background

# Pane backgrounds
source_pane_bg = "#1C1C1C"     # Dark gray, slightly lighter than terminal default
preview_pane_bg = "#FDFDFB"    # Very pale warm white (barely off-white)
status_bar_bg = "#2A2A2A"      # Slightly lighter than source pane for visual separation
context_footer_bg = "#252525"  # Subtle gray for context footer (between source pane and status bar)

# Input and prompt colors (for save-as, export, etc.)
prompt_fg = "#FFFFFF"       # Prompt label text (white for good contrast on dark)
prompt_bg = "#333333"       # Prompt label background (dark gray)
input_fg = "#FFFFFF"        # User input text (white on dark terminal background)
input_bg = "#1A1A1A"        # User input background (very dark, slightly lighter than terminal)
input_cursor = "#7D56F4"    # Input cursor (primary brand color)

[formatter]
verbose = false
include_errors = true
default_format = "text"
