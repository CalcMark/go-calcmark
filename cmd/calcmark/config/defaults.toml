# CalcMark Default Configuration
# This file is embedded in the binary at build time.
# User overrides: ~/.config/calcmark/config.toml or ~/.calcmarkrc.toml

# Display locale for number formatting (decimal/thousand separators).
# Supported: "en-US", "de-DE", "fr-FR"
locale = "en-US"

[tui]
# Color mode: "light" or "dark"
# Set to "light" if you use a light terminal background.
color_mode = "dark"

# Use Unicode fraction symbols (½, ⅓, ¾, ⅛, etc.) in the preview pane.
# Set to false if your terminal font shows empty boxes for these characters.
unicode_fractions = true

[tui.theme]
# These overrides replace the corresponding palette color for your color_mode.
# Leave empty to use the built-in adaptive palette defaults.
# All internal structural colors (popup borders, separator shades, etc.)
# derive from the palette and are not user-configurable.

# Primary brand color - titles, prompts, variable names
primary = ""
# Accent color - borders, highlights
accent = ""
# Error messages
error = ""
# Changed/modified indicator
warning = ""
# Help text, secondary info
muted = ""
# Hints, suggestions, preview text
dimmed = ""
# Calculation results
output = ""
# Syntax emphasis
bright = ""
# Divider lines
separator = ""

# Pane backgrounds (leave empty for palette defaults)
source_pane_bg = ""
preview_pane_bg = ""
status_bar_bg = ""

[formatter]
verbose = false
include_errors = true
default_format = "text"
