version: '3'

vars:
  BINARY_NAME: cm
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: -s -w -X main.Version={{.VERSION}} -X main.BuildTime={{.BUILD_TIME}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Testing ────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test ./...  -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
      - echo 'Coverage report generated at coverage.html'

  # ── Build ──────────────────────────────────────────────────────────

  build:
    desc: Build CLI for current platform
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY_NAME}} ./cmd/calcmark
      - echo 'Built {{.BINARY_NAME}}'

  build:all:
    internal: true
    deps:
      - build:linux
      - build:darwin
      - build:windows

  build:linux:
    internal: true
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY_NAME}}-linux-amd64 ./cmd/calcmark
      - GOOS=linux GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY_NAME}}-linux-arm64 ./cmd/calcmark
      - echo 'Built Linux binaries'

  build:darwin:
    internal: true
    cmds:
      - mkdir -p dist
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY_NAME}}-darwin-amd64 ./cmd/calcmark
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY_NAME}}-darwin-arm64 ./cmd/calcmark
      - echo 'Built macOS binaries'

  build:windows:
    internal: true
    cmds:
      - mkdir -p dist
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY_NAME}}-windows-amd64.exe ./cmd/calcmark
      - echo 'Built Windows binary'

  # ── Development ────────────────────────────────────────────────────

  dev:
    desc: Run in development mode (use -- to pass args, e.g. task dev -- eval file.cm)
    cmds:
      - go run ./cmd/calcmark {{.CLI_ARGS}}

  # ── Quality ────────────────────────────────────────────────────────

  lint:
    desc: Run basic linters (fmt, vet)
    cmds:
      - go fmt ./...
      - go vet ./...
      - echo '✓ Basic linting passed'

  modernize:
    internal: true
    cmds:
      - go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest ./...
      - echo '✓ Modernize check passed'

  staticcheck:
    internal: true
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - echo '✓ Staticcheck passed'

  quality:
    desc: Run all quality checks (recommended before commit)
    cmds:
      - task: lint
      - task: modernize
      - task: staticcheck
      - echo '✓ All quality checks passed'

  security:
    desc: Run security-focused tests
    cmds:
      - go test -v -run "TestValidateFilePath|TestValidateReadFilePath" ./cmd/calcmark/cmd
      - go test -v -run "TestSecurity" ./spec/parser
      - go test -v -run "Fuzz" -fuzz=. -fuzztime=5s ./spec/lexer
      - go test -v -run "Fuzz" -fuzz=. -fuzztime=5s ./spec/parser
      - go test -v -run "Fuzz" -fuzz=. -fuzztime=5s ./spec/document
      - echo '✓ Security tests passed'

  # ── Benchmarks ─────────────────────────────────────────────────────

  bench:
    internal: true
    cmds:
      - go test ./... -run='^$' -bench=. -benchmem

  # ── Maintenance ────────────────────────────────────────────────────

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -rf dist/
      - rm -f coverage.out coverage.html
      - go clean -cache

  deps:update:
    desc: Update dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  # ── Website ────────────────────────────────────────────────────────

  generate-docs:
    internal: true
    cmds:
      - go run ./cmd/docgen
    sources:
      - spec/features/registry.go
    generates:
      - site/data/features.json

  site:
    desc: Start Hugo dev server for the website
    deps:
      - generate-docs
    cmds:
      - hugo server --source site --buildDrafts

  site:build:
    desc: Build the website
    deps:
      - generate-docs
    cmds:
      - hugo --source site --minify
      - echo 'Site built to site/public/'

  record-demos:
    desc: Regenerate all demo GIFs for the website
    cmds:
      - vhs docs/images/hero.tape
      - vhs docs/images/feature-variables.tape
      - vhs docs/images/feature-eval.tape
      - vhs docs/images/feature-export.tape
      - cp docs/images/hero.gif site/static/images/
      - cp docs/images/feature-variables.gif site/static/images/
      - cp docs/images/feature-eval.gif site/static/images/
      - cp docs/images/feature-export.gif site/static/images/
      - echo '✓ All demo GIFs regenerated and copied to site/static/images/'
    sources:
      - docs/images/*.tape
    generates:
      - site/static/images/hero.gif
      - site/static/images/feature-variables.gif
      - site/static/images/feature-eval.gif
      - site/static/images/feature-export.gif

  # ── Examples ───────────────────────────────────────────────────────

  example:dates:
    internal: true
    cmds:
      - echo "today + 7 days" | ./{{.BINARY_NAME}} eval
      - echo "Dec 25 2025 + 30 days" | ./{{.BINARY_NAME}} eval

  example:units:
    internal: true
    cmds:
      - echo "5 kg + 10 lb" | ./{{.BINARY_NAME}} eval
      - echo "10 meters + 5 feet" | ./{{.BINARY_NAME}} eval

  example:
    desc: Run all examples
    deps:
      - build
    cmds:
      - task: example:dates
      - task: example:units

  # ── Release ────────────────────────────────────────────────────────

  release:
    desc: Build release binaries (runs all quality checks first)
    cmds:
      - task: clean
      - task: quality       # lint + modernize + staticcheck
      - task: test          # All tests must pass
      - task: bench         # Benchmark regressions
      - task: security      # Security tests + fuzzing
      - task: build:all
      - echo 'Release binaries built in dist/'
