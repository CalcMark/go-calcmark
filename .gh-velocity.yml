# gh-velocity configuration
# Generated by: gh velocity config preflight -R CalcMark/go-calcmark
# Date: 2026-03-21

# Scope: which issues/PRs to analyze (GitHub search syntax).
# Override per-run with: --scope 'label:"priority:high"'
scope:
  query: 'repo:CalcMark/go-calcmark -label:"duplicate" -label:"invalid"'
  # Excluded 2 noise label(s) detected in this repo: duplicate, invalid

# Issue/PR classification — first matching category wins; unmatched = "other".
# Matchers: label:<name>, type:<name>, title:/<regex>/i
quality:
  categories:
    - name: bug
      match:
        - "type:Bug" # repo-configured issue type
        - "label:bug"
        - "title:/\\bfix(es|ed)?\\b/i"
        - "title:/^fix[\\(: ]/i"
        - "title:/^bug[\\(: ]/i"
    - name: feature
      match:
        - "type:Feature" # repo-configured issue type
        - "label:enhancement"
        - "title:/^feat[\\(: ]/i"
        - "title:/^add[\\(: ]/i"
        - "title:/^feature[\\(: ]/i"
    - name: chore
      match:
        - "type:Task" # repo-configured issue type
        - "title:/^refactor[\\(: ]/i"
        - "title:/^chore[\\(: ]/i"
        - "title:/^ci[\\(: ]/i"
        - "title:/^build[\\(: ]/i"
    - name: docs
      match:
        - "label:documentation"
        - "title:/^docs?[\\(: ]/i"
  hotfix_window_hours: 72

# Commit message scanning
commit_ref:
  patterns: ["closes"]

# Cycle time strategy: issue
cycle_time:
  strategy: issue

# Exclude bot accounts from metrics.
exclude_users:
  - "dependabot[bot]"

# Minimum seconds between GitHub search API calls.
# Prevents secondary (abuse) rate limits which trigger on burst traffic.
# Set to 0 to disable (not recommended for CI).
api_throttle_seconds: 2

# Lifecycle stages (label-based, no project board)
# match: patterns use classify.Matcher syntax for cycle time detection
lifecycle:
  in-progress:
    match:
      - "label:in-progress"

# Post bulk reports (--post) as Discussion posts.
# CI/Actions: requires 'discussions: write' in workflow permissions.
discussions:
  category: General
  title: "Weekly Velocity: ({{.Date}})" # optional Go template
  # repo: owner/other-repo                            # optional: post to a different repo

# Effort: how effort is assigned to work items (shared by velocity and WIP).
effort:
  strategy: count

# WIP limits: warn when work-in-progress exceeds these effort-weighted thresholds.
# Based on 1 human items currently in progress
wip:
  team_limit: 5.0 # total items across all assignees
  person_limit: 5.0 # max items per individual assignee
  # bots: additional bot accounts (case-insensitive exact match)
  # bots:
  #   - "claude-assistant"
  #   - "openai-bot"

# Velocity: effort completed per iteration.
velocity:
  unit: issues
  iteration:
    strategy: fixed
    fixed:
      length: "14d"
      anchor: "2026-03-16"
    count: 3
