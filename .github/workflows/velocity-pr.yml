name: PR Velocity Metrics

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to annotate'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  metrics:
    name: Annotate PR with Velocity Metrics
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.actor))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh-velocity
        run: gh extension install dvhthomas/gh-velocity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate metrics
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          METRICS=$(gh velocity pr ${{ steps.pr.outputs.number }} -r markdown 2>/dev/null || echo "")
          if [ -z "$METRICS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Write metrics to a file to preserve formatting
          echo "$METRICS" > /tmp/velocity-metrics.md
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update PR body
        if: steps.metrics.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          METRICS=$(cat /tmp/velocity-metrics.md)

          # Get current body
          CURRENT_BODY=$(gh pr view "$PR_NUM" --json body --jq '.body // ""')

          # Build the metrics block
          METRICS_BLOCK="<!-- gh-velocity-start -->
          ---
          <details>
          <summary>Velocity Metrics</summary>

          ${METRICS}

          </details>
          <!-- gh-velocity-end -->"

          # Check if sentinel markers already exist and replace, otherwise append
          if echo "$CURRENT_BODY" | grep -q '<!-- gh-velocity-start -->'; then
            # Replace existing block using awk
            NEW_BODY=$(echo "$CURRENT_BODY" | awk '
              /<!-- gh-velocity-start -->/{skip=1; next}
              /<!-- gh-velocity-end -->/{skip=0; next}
              !skip{print}
            ')
            NEW_BODY="${NEW_BODY}
          ${METRICS_BLOCK}"
          else
            NEW_BODY="${CURRENT_BODY}

          ${METRICS_BLOCK}"
          fi

          gh pr edit "$PR_NUM" --body "$NEW_BODY"
