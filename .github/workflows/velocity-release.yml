name: Release Velocity Metrics

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.6.5)'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  discussions: write

jobs:
  metrics:
    name: Post Release Velocity Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: gh extension install dvhthomas/gh-velocity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release quality report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_ID: "R_kgDOQSei8w"
          CATEGORY_ID: "DIC_kwDOQSei884C4Bnr"
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi

          # Generate markdown (no --post, we post manually with a custom title)
          gh velocity quality release "$TAG" -r markdown > /tmp/release-report.md

          TITLE="Release Velocity: $TAG"
          BODY=$(cat /tmp/release-report.md)

          gh api graphql \
            -f query='mutation($repoId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repoId, categoryId: $categoryId, title: $title, body: $body}) {
                discussion { url }
              }
            }' \
            -f repoId="$REPO_ID" \
            -f categoryId="$CATEGORY_ID" \
            -f title="$TITLE" \
            -f body="$BODY" \
            --jq '.data.createDiscussion.discussion.url'
