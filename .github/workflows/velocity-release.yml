name: Release Velocity Metrics

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.6.5)'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  discussions: write

jobs:
  metrics:
    name: Post Release Velocity Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh-velocity
        run: gh extension install dvhthomas/gh-velocity --pin v0.1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Post release quality report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_VELOCITY_POST_LIVE: 'true'
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: gh velocity quality release "$TAG_NAME" --post -r markdown
