name: Issue Velocity Metrics

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to annotate'
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  metrics:
    name: Annotate Issue with Velocity Metrics
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.state_reason == 'completed'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gh-velocity
        run: gh extension install dvhthomas/gh-velocity --pin v0.1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate metrics
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh velocity issue "$ITEM_NUMBER" -r markdown > /tmp/velocity-metrics.md 2>/dev/null || true
          if [ ! -s /tmp/velocity-metrics.md ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update issue body
        if: steps.metrics.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Get current body to a file (avoids shell injection via body content)
          gh issue view "$ITEM_NUMBER" --json body --jq '.body // ""' > /tmp/current-body.txt

          # Build the metrics block
          {
            echo '<!-- gh-velocity-start -->'
            echo '---'
            echo '<details>'
            echo '<summary>Velocity Metrics</summary>'
            echo ''
            cat /tmp/velocity-metrics.md
            echo ''
            echo '</details>'
            echo '<!-- gh-velocity-end -->'
          } > /tmp/metrics-block.txt

          # Strip old sentinel block if present, then append new one
          sed '/<!-- gh-velocity-start -->/,/<!-- gh-velocity-end -->/d' /tmp/current-body.txt > /tmp/new-body.txt
          echo '' >> /tmp/new-body.txt
          cat /tmp/metrics-block.txt >> /tmp/new-body.txt

          gh issue edit "$ITEM_NUMBER" --body-file /tmp/new-body.txt
