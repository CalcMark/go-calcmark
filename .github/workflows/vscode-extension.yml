name: VS Code Extension

on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: editors/vscode-calcmark
        run: npm ci

      - name: Compile
        working-directory: editors/vscode-calcmark
        run: npm run compile

      - name: Determine release type
        id: release-type
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-pre"* ]]; then
            echo "pre_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (pre-release)
        if: steps.release-type.outputs.pre_release == 'true'
        working-directory: editors/vscode-calcmark
        run: npx vsce publish --pre-release -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish (stable)
        if: steps.release-type.outputs.pre_release == 'false'
        working-directory: editors/vscode-calcmark
        run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
