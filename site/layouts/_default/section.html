{{ define "main" }}
<div class="docs-layout container">
  {{ if eq .Section "docs" }}{{ partial "sidebar.html" . }}{{ end }}
  <div class="docs-content">
    {{- $lark := resources.Get "images/lark.svg" | fingerprint -}}
    <h1>{{ .Title }}<img src="{{ $lark.RelPermalink }}" alt="" class="page-lark" aria-hidden="true"></h1>
    {{ .Content }}
    <div class="page-grid">
      {{ range .Pages.ByWeight }}
      <a href="{{ .RelPermalink }}" class="page-card">
        <h3>{{ .Title }}</h3>
        {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      </a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
