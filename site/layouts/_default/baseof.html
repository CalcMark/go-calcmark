<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/theme.js" | fingerprint }}
  <script src="{{ $js.RelPermalink }}"></script>
  {{ $tabs := resources.Get "js/tabs.js" | fingerprint }}
  <script src="{{ $tabs.RelPermalink }}"></script>
</body>
</html>
