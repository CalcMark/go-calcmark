<header class="site-nav">
  <div class="container nav-inner">
    {{- $lark := resources.Get "images/lark.svg" | fingerprint -}}
    {{- $larkColor := resources.Get "images/lark-color.svg" | fingerprint -}}
    <a href="{{ "/" | relURL }}" class="nav-logo"><img src="{{ $lark.RelPermalink }}" alt="" class="nav-logo-icon" aria-hidden="true">CalcMark</a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" onclick="this.setAttribute('aria-expanded',this.getAttribute('aria-expanded')==='false');document.querySelector('.nav-links').classList.toggle('nav-open')">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="5" x2="15" y2="5"/><line x1="3" y1="9" x2="15" y2="9"/><line x1="3" y1="13" x2="15" y2="13"/></svg>
    </button>
    <nav class="nav-links" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
      <a class="nav-link{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} nav-link--active{{ end }}"
         href="{{ .URL }}"{{ with .Params.external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="nav-link nav-link--lark"
         href="{{ site.Params.larkURL }}" target="_blank" rel="noopener"><img src="{{ $larkColor.RelPermalink }}" alt="" class="nav-lark-icon" aria-hidden="true">Try it live</a>
    </nav>
    <button id="search-toggle" class="search-toggle" type="button" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="5"/><line x1="10" y1="10" x2="15" y2="15"/></svg>
      <kbd class="search-kbd">/</kbd>
    </button>
    {{ partial "theme-toggle.html" . }}
  </div>
</header>
