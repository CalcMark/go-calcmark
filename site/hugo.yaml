baseURL: "https://calcmark.org/"
languageCode: en-us
title: CalcMark

# Disable features not needed for a docs site
disableKinds:
  - taxonomy
  - term
  - RSS

# Auto "last updated" dates from git history
enableGitInfo: true

params:
  description: "Calculations embedded in markdown documents."
  githubURL: "https://github.com/CalcMark/go-calcmark"
  # Version is injected at build time via HUGO_PARAMS_version environment variable.
  # Falls back to "dev" for local builds.
  version: "dev"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

menus:
  main:
    - name: Docs
      url: /docs/
      weight: 10
    - name: Examples
      url: /docs/examples/
      weight: 20
    - name: Larky
      url: /larky/
      weight: 25
    - name: GitHub
      url: https://github.com/CalcMark/go-calcmark
      weight: 30
      params:
        external: true

  docs:
    # ── Guides ──
    - name: Guides
      params: { section: true }
      weight: 1
    - name: Getting Started
      url: /docs/getting-started/
      weight: 10
    - name: User Guide
      url: /docs/user-guide/
      weight: 20
    - name: Domain Recipes
      url: /guides/
      weight: 25

    # ── Reference ──
    - name: Reference
      params: { section: true }
      weight: 30
    - name: Language Reference
      url: /docs/language-reference/
      weight: 31
    - name: Examples
      identifier: sidebar-examples
      url: /docs/examples/
      weight: 32
    - name: Agents
      url: /docs/agent-integration/
      weight: 33
    - name: Go Package
      url: /docs/go-package/
      weight: 34

    # ── Apps ──
    - name: Apps
      params: { section: true }
      weight: 40
    - name: The Editor
      url: /docs/editor/
      weight: 41
    - name: Command Line
      url: /docs/cli-reference/
      weight: 42
    - name: Configuration
      url: /docs/configuration/
      weight: 43
    - name: Examples
      url: /docs/examples/
      weight: 50
