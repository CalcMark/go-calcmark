<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- CalcMark favicon: Lark silhouette in brand purple, 16×16 -->
  <g id="lark">
    <rect x="9" y="0" width="2" height="1" fill="#7D56F4"/>
    <rect x="7" y="1" width="6" height="1" fill="#7D56F4"/>
    <rect x="6" y="2" width="8" height="1" fill="#7D56F4"/>
    <!-- Eye + beak -->
    <rect x="6" y="3" width="3" height="1" fill="#7D56F4"/>
    <rect x="10" y="3" width="5" height="1" fill="#7D56F4"/>
    <rect x="6" y="4" width="9" height="1" fill="#7D56F4"/>
    <!-- Neck -->
    <rect x="8" y="5" width="5" height="1" fill="#7D56F4"/>
    <!-- Body -->
    <rect x="6" y="6" width="8" height="1" fill="#7D56F4"/>
    <!-- Wing fold (bigger gap) -->
    <rect x="4" y="7" width="2" height="1" fill="#7D56F4"/>
    <rect x="8" y="7" width="6" height="1" fill="#7D56F4"/>
    <rect x="2" y="8" width="2" height="1" fill="#7D56F4"/>
    <rect x="8" y="8" width="5" height="1" fill="#7D56F4"/>
    <!-- Body wide -->
    <rect x="2" y="9" width="12" height="1" fill="#7D56F4"/>
    <rect x="1" y="10" width="12" height="1" fill="#7D56F4"/>
    <rect x="0" y="11" width="12" height="1" fill="#7D56F4"/>
    <!-- Tail + belly -->
    <rect x="0" y="12" width="4" height="1" fill="#7D56F4"/>
    <rect x="7" y="12" width="5" height="1" fill="#7D56F4"/>
    <rect x="8" y="13" width="3" height="1" fill="#7D56F4"/>
    <!-- Legs + feet -->
    <rect x="8" y="14" width="2" height="1" fill="#7D56F4"/>
    <rect x="11" y="14" width="2" height="1" fill="#7D56F4"/>
    <rect x="8" y="15" width="3" height="1" fill="#7D56F4"/>
    <rect x="11" y="15" width="3" height="1" fill="#7D56F4"/>
  </g>
</svg>
