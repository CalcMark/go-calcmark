<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 22 12" shape-rendering="crispEdges">
  <!-- Bold 8-bit "cm" in CalcMark brand purple, 1 fat-pixel gap -->
  <g id="letter-c">
    <rect x="2" y="0" width="6" height="2" fill="#7D56F4"/>
    <rect x="0" y="2" width="2" height="6" fill="#7D56F4"/>
    <rect x="2" y="8" width="6" height="2" fill="#7D56F4"/>
  </g>
  <g id="letter-m">
    <rect x="10" y="0" width="2" height="10" fill="#7D56F4"/>
    <rect x="18" y="0" width="2" height="10" fill="#7D56F4"/>
    <rect x="12" y="2" width="2" height="2" fill="#7D56F4"/>
    <rect x="16" y="2" width="2" height="2" fill="#7D56F4"/>
    <rect x="14" y="4" width="2" height="6" fill="#7D56F4"/>
  </g>
</svg>
